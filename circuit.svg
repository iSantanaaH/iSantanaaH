<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081430" />
      <stop offset="100%" stop-color="#040a1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Circuit Paths -->
  <path d="M50 100 H350 L400 150 H800 L850 100 H1150" fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1.5" />
  <path d="M50 300 H250 L300 250 H700 L750 300 H1150" fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1.5" />
  <path d="M400 0 V150" fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1.5" />
  <path d="M750 300 V400" fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Animated Pulses -->
  <path d="M50 100 H350 L400 150 H800 L850 100 H1150" fill="none" stroke="#4fd8ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 500" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="620;0" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M50 300 H250 L300 250 H700 L750 300 H1150" fill="none" stroke="#4fd8ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 500" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="620;0" dur="5s" begin="1.5s" repeatCount="indefinite" />
  </path>

  <!-- Glowing Nodes -->
  <g filter="url(#glow)">
    <circle cx="350" cy="100" r="8" fill="#4fd8ff" opacity="0.3" />
    <circle cx="350" cy="100" r="3.5" fill="#4fd8ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="150" r="8" fill="#4fd8ff" opacity="0.3" />
    <circle cx="400" cy="150" r="3.5" fill="#4fd8ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="250" r="8" fill="#4fd8ff" opacity="0.3" />
    <circle cx="300" cy="250" r="3.5" fill="#4fd8ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="300" r="8" fill="#4fd8ff" opacity="0.3" />
    <circle cx="750" cy="300" r="3.5" fill="#4fd8ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="1.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>